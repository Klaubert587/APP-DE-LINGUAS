<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KLARETTU</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<style>

:root{
--bg-main:#2a2a2a;
--panel-bg:#2a2a2a;
--accent:#00ff9d;
--accent-glow:rgba(0,255,157,0.4);

--shd-in:inset 3px 3px 7px #1b1b1b,inset -3px -3px 7px #393939;

body{
background:var(--bg-main);
color:#ccc;
font-family:'Segoe UI',sans-serif;
margin:0;
display:flex;
flex-direction:column;
align-items:center;

}

/* visor */

.machine-display{
width:88%;
max-width:360px;
height:260px;
background:var(--panel-bg);
margin-top:40px;
border-radius:40px;
box-shadow:var(--shd-out);

align-items:center;

/* TAMANHO E COR TEXTO EM COREANO */

#coreano-txt{
font-size:28px;
color: #dbd4d3;
text-shadow:0 0 15px var(--accent-glow);
font-weight:bold;
}

/* COR TEXTO TRADUÇÃO */

#traducao-txt{
font-size:13px;
color:#cccccc;

}

/* COR TEXTO BALÃO */

select{
background:var(--bg-main);
border:none;
color: #f1f8d0;
padding:12px;
border-radius:17px;
text-shadow: 0 0 15px #a3a3a3;

}

/* botões */

.bottom-nav{
position:fixed;
bottom:30px;
width:92%;
max-width:420px;
display:flex;
justify-content:space-around;
align-items:center;
}

.btn-hw{
    width: 43px; /* Reduzido de 55px para 45px */
    height: 43px; /* Reduzido de 55px para 45px */
    background: var(--panel-bg);
    border-radius: 20%;
    box-shadow: var(--shd-out);
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    cursor: pointer;
}

/* COR ICONES botões */

.btn-hw i{
color:#c5c5c5;
font-size:18px;
}

.btn-play-hw{
width:85px;
height:85px;
background:var(--panel-bg);
border-radius:50%;
box-shadow:var(--shd-out);
border:3px solid #5a5a5a;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
}

/* COR BOTÃO INICIAR */

.btn-play-hw i{
color: #e3ffc3;
font-size:32px;
text-shadow: 0 0 15px #2c2e2a; /* O sombreado agora usa a mesma cor */
}

/* CORES TITULOS - modais */

.modal{
display:none;
position:fixed;
inset:0;
background:var(--bg-main);
padding:25px;
overflow-y:auto;
}

input,textarea{
width:100%;
padding:12px;
background:#1a1a1a;
border:none;
border-radius:10px;
color:white;
margin-bottom:10px;
box-shadow:var(--shd-in);
}

.btn-save{
background:var(--accent);
color:#000000;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
width:100%;
cursor:pointer;
}

.btn-back{
margin-top:20px;
width:100%;
background:none;
border:1px solid #1a1919;
color:#c4c0c0;
padding:10px;
cursor:pointer;
}

</style>
</head>

<!-- TELA TREINO ESCRITA -->

<div id="tela-treino-escrita" class="modal">
    <h2>Treino de Montagem</h2>
    
    <div class="machine-display">
        <div id="display-baloes-treino" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <div class="balao-coreano" onclick="falarTreino(1.0)" style="cursor:pointer; background: var(--panel-bg);">
                <h1 id="escrita-pergunta" style="margin:0; font-size: 22px; color: #fff;">...</h1>
            </div>
            
            <div class="balao-traducao">
                <p id="escrita-dica" style="margin:0; min-height: 1.2em; color: var(--accent);"></p>
            </div>
        </div>

        <div style="margin-top: 15px; display: flex; gap: 25px; font-size: 20px;">
            <i class="fas fa-volume-up" onclick="falarTreino(1.0)" style="cursor:pointer; color:var(--accent)"></i>

           style="width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--shd-in); color: var(--accent); margin-top: 20px; text-align: center; font-weight: bold;" readonly>

<script>

function falarTreino(velocidade) {
    // Pega o texto da pergunta ou o item atual da lista de treino
    let texto = listaTreino[indiceTreino].coreano; 
    
    if(!texto) return;

    speechSynthesis.cancel(); 

    let msg = new SpeechSynthesisUtterance(texto);
    msg.lang = document.getElementById("idioma-voz").value;
    msg.rate = velocidade; 
    
    speechSynthesis.speak(msg);
}    

/* BANCO */

let banco={}
let gramatica=[]

/* INIT */

window.onload=()=>{

let db=localStorage.getItem("db")
let gr=localStorage.getItem("gram")

if(db) banco=JSON.parse(db)
if(gr) gramatica=JSON.parse(gr)

atualizarPastas()

}


/* UI */

function abrir(id){

document.getElementById(id).style.display="block"

}

function fechar(){

document.querySelectorAll(".modal").forEach(m=>m.style.display="none")

}

/* SALVAR EXERCICIO */

function salvarExercicio(){

let pasta=document.getElementById("in-p").value.trim()
let coreano=document.getElementById("in-c").value.trim()
let traducao=document.getElementById("in-t").value.trim()
let romanizacao=document.getElementById("in-r").value.trim()
let ordem=parseInt(document.getElementById("in-o").value)

if(!pasta||!coreano||!traducao){
alert("Preencha tudo")
return
}

if(!banco[pasta]) banco[pasta]=[]

banco[pasta].push({
ordem:ordem||banco[pasta].length+1,
coreano,
traducao,
romanizacao
})

localStorage.setItem("db",JSON.stringify(banco))

atualizarPastas()

alert("Salvo")

}

/* PASTAS */

function atualizarPastas(){

/* atualizar seletor da pagina principal */

let seletorPrincipal = document.getElementById("select-p")

if(seletorPrincipal){

seletorPrincipal.innerHTML=""

for(let pasta in banco){

let opt=document.createElement("option")
opt.value=pasta
opt.textContent=pasta

seletorPrincipal.appendChild(opt)

}

}


/* atualizar seletor do dialogo */

let seletorDialogo = document.getElementById("select-dialogo")

if(seletorDialogo){

seletorDialogo.innerHTML=""

for(let pasta in banco){

let opt=document.createElement("option")
opt.value=pasta
opt.textContent=pasta

seletorDialogo.appendChild(opt)

}

}


/* atualizar lista visual da tela arquivo */

mostrarPastasArquivo()

}

function mostrarPastasArquivo(){

let area = document.getElementById("lista-pastas")

if(!area) return

area.innerHTML=""

for(let pasta in banco){

let linha = document.createElement("div")

linha.style.marginBottom="10px"

linha.innerHTML = `
<label>
<input type="checkbox" onchange="marcarEstudado('${pasta}',this.checked)">
${pasta}
</label>

<button onclick="editarPasta('${pasta}')">Editar itens</button>

<button onclick="apagarPasta('${pasta}')">Apagar pasta</button>
`

area.appendChild(linha)

}

}

/* VOZ */

function falar(txt){

let msg=new SpeechSynthesisUtterance(txt)

msg.lang=document.getElementById("idioma-voz").value

let vel=document.getElementById("velocidade").value
msg.rate=vel

speechSynthesis.speak(msg)

}

/* PLAY PASTA */

function playVoz(){

let pasta=document.getElementById("select-p").value

if(!banco[pasta]){
alert("Pasta vazia")
return
}

let lista=banco[pasta]

let i=0

function loop(){

if(i>=lista.length) return

let item=lista[i]

document.getElementById("coreano-txt").innerText=item.coreano
document.getElementById("traducao-txt").innerText=item.traducao

falar(item.coreano)

i++

setTimeout(loop,2500)

}

loop()

}

/* GRAMATICA */

function salvarGramatica(){

let titulo=document.getElementById("gram-titulo").value
let desc=document.getElementById("gram-desc").value

gramatica.push({titulo,desc})

localStorage.setItem("gram",JSON.stringify(gramatica))

alert("Regra salva")

}

/* EXPORTAR BANCO */

function exportarDB(){

let dados={
exercicios:banco,
gramatica:gramatica
}

let json=JSON.stringify(dados,null,2)

let blob=new Blob([json],{type:"application/json"})

let url=URL.createObjectURL(blob)

let a=document.createElement("a")

a.href=url
a.download="LPRO_BANCO.json"

a.click()

}

/* IMPORTAR BANCO */

function importarDB(event){

let file=event.target.files[0]

if(!file) return

let reader=new FileReader()

reader.onload=function(e){

let dados=JSON.parse(e.target.result)

if(dados.exercicios){

for(let pasta in dados.exercicios){

if(!banco[pasta]){
banco[pasta]=[]
}

banco[pasta]=banco[pasta].concat(dados.exercicios[pasta])

}

}

if(dados.gramatica) gramatica=dados.gramatica

localStorage.setItem("db",JSON.stringify(banco))
localStorage.setItem("gram",JSON.stringify(gramatica))

atualizarPastas()

alert("Banco importado com sucesso")

}

reader.readAsText(file)

}

/* CONTROLE DE DIÁLOGO (PLAY/PAUSE/INICIAR) */
let dialogoRodando = false;
let indiceDialogo = 0; 

// Agora a função aceita o comando 'resetar'
function iniciarDialogo(resetar = true) {
    let pasta = document.getElementById("select-dialogo").value;

    if (!banco[pasta]) {
        alert("Sem exercícios");
        return;
    }

    // Se resetar for true (botão INICIAR), volta para o 0.
    // Se for false (botão PLAY da home), mantém o índice atual.
    if (resetar) {
        indiceDialogo = 0;
    }

    dialogoRodando = true;
    let lista = banco[pasta];
    let velocidade = document.getElementById("velocidade").value;
    let tempo = parseInt(document.getElementById("tempo").value);

    function loop() {
        if (!dialogoRodando) return;

        // Se chegar ao fim da pasta, reinicia o ciclo
        if (indiceDialogo >= lista.length) {
            indiceDialogo = 0;
        }

        let item = lista[indiceDialogo];

        /* Atualizar Display */
        document.getElementById("coreano-txt").innerText = item.coreano;
        document.getElementById("traducao-txt").innerText = item.traducao;

        /* Criar Voz */
        let msg = new SpeechSynthesisUtterance(item.coreano);
        msg.lang = document.getElementById("idioma-voz").value;
        msg.rate = velocidade;

        /* Quando a fala terminar */
        msg.onend = function() {
            if (dialogoRodando) {
                indiceDialogo++;
                setTimeout(loop, tempo);
            }
        };

        speechSynthesis.speak(msg);
    }

    loop();
}

function pausarDialogo() {
    dialogoRodando = false;
    speechSynthesis.cancel();
}

/* VARIÁVEIS DO TREINO DE ESCRITA */
let listaTreino = [];
let indiceTreino = 0;

function iniciarTreinoEscrita() {
    let pasta = document.getElementById("select-p").value; // Pega a pasta da tela principal

    if (!banco[pasta] || banco[pasta].length === 0) {
        alert("Selecione uma pasta com exercícios primeiro!");
        fechar();
        return;
    }

    // Prepara a lista e embaralha (opcional, mas bom para treinar)
    listaTreino = [...banco[pasta]];
    indiceTreino = 0;
    
    proximaQuestao();
}

function proximaQuestao() {
    if (indiceTreino >= listaTreino.length) {
        alert("Treino concluído! Parabéns! 🎉");
        fechar();
        return;
    }

    let item = listaTreino[indiceTreino];
    
    // 1. Mostra a tradução (Português) no balão principal
    document.getElementById("escrita-pergunta").innerText = item.traducao;
    document.getElementById("escrita-dica").innerText = ""; 
    document.getElementById("campo-resposta").value = "";

    // 2. Gera os balões pequenos com o idioma alvo (Ex: Coreano)
    gerarBaloesPalavras(item.coreano);
    
    // 3. Opcional: Fala a frase automaticamente ao começar (Velocidade Normal)
    setTimeout(() => falarTreino(1.0), 500);
}

function gerarBaloesPalavras(frase) {
    let container = document.getElementById("container-palavras");
    container.innerHTML = "";
    
    // Divide a frase em palavras e embaralha
    let palavras = frase.split(" ").sort(() => Math.random() - 0.5);

    palavras.forEach(palavra => {
        let btn = document.createElement("button");
        btn.innerText = palavra;
        
        // Estilo Neumórfico (Mantido)
        btn.style.padding = "10px 18px";
        btn.style.border = "none";
        btn.style.borderRadius = "15px";
        btn.style.background = "var(--panel-bg)";
        btn.style.boxShadow = "var(--shd-out)";
        btn.style.color = "white";
        btn.style.cursor = "pointer";
        btn.style.fontSize = "16px";
        
        btn.onclick = () => {
            // 1. Falar a palavra clicada (no idioma alvo)
            falarPalavraIndividual(palavra);

            // 2. Adicionar ao campo de resposta
            let campo = document.getElementById("campo-resposta");
            campo.value += (campo.value ? " " : "") + palavra;
            
            // 3. Efeito visual de desabilitado
            btn.style.opacity = "0.2";
            btn.style.pointerEvents = "none"; 
        };
        container.appendChild(btn);
    });
}

// Nova função auxiliar para falar apenas a palavra do balão pequeno
function falarPalavraIndividual(palavra) {
    speechSynthesis.cancel(); // Para a fala anterior para não embolar
    let msg = new SpeechSynthesisUtterance(palavra);
    msg.lang = document.getElementById("idioma-voz").value || "ko-KR";
    msg.rate = 0.8; // Uma velocidade levemente mais lenta para clareza
    speechSynthesis.speak(msg);
}

function falarTreino(velocidade) {
    let item = listaTreino[indiceTreino];
    if(!item) return;

    speechSynthesis.cancel(); 
    let msg = new SpeechSynthesisUtterance(item.coreano);
    
    // Pega o idioma selecionado na tela de diálogo (ex: ko-KR)
    msg.lang = document.getElementById("idioma-voz").value || "ko-KR";
    msg.rate = velocidade; 
    
    speechSynthesis.speak(msg);
}

function verificarResposta() {
    let usuario = document.getElementById("campo-resposta").value.trim();
    let correto = listaTreino[indiceTreino].coreano.trim();

    if(usuario === correto) {
        alert("Correto! Vamos para a próxima.");
        indiceTreino++;
        proximaQuestao();
    } else {
        alert("Ops! A ordem está diferente. Tente de novo.");
        limparResposta();
    }
}

function limparResposta() {
    document.getElementById("campo-resposta").value = "";
    gerarBaloesPalavras(listaTreino[indiceTreino].coreano);
}
function apagarPasta(nomePasta){

let confirmar = confirm("Apagar a pasta '"+nomePasta+"' e todos os exercícios?")

if(!confirmar) return

delete banco[nomePasta]

localStorage.setItem("db",JSON.stringify(banco))

atualizarPastas()

alert("Pasta apagada")

}

function editarPasta(nomePasta){

let lista=banco[nomePasta]

if(!lista || lista.length==0){
alert("Pasta vazia")
return
}

let texto="EXERCÍCIOS DA PASTA: "+nomePasta+"\n\n"

lista.forEach((item,i)=>{

texto += (i+1)+" - "+item.coreano+" / "+item.traducao+"\n"

})

// Variável para guardar a ordem dos botões clicados (coloque no topo do script)
let historicoBaloes = [];

function gerarBaloesPalavras(frase) {
    let container = document.getElementById("container-palavras");
    container.innerHTML = "";
    historicoBaloes = []; // Reseta o histórico ao iniciar nova questão

    let palavras = frase.split(" ").sort(() => Math.random() - 0.5);

    palavras.forEach((palavra, index) => {
        let btn = document.createElement("button");
        btn.innerText = palavra;
        btn.id = "btn-palavra-" + index; // ID único para podermos reabilitar depois
        
        // Estilo mantido
        btn.style.padding = "10px 18px";
        btn.style.border = "none";
        btn.style.borderRadius = "15px";
        btn.style.background = "var(--panel-bg)";
        btn.style.boxShadow = "var(--shd-out)";
        btn.style.color = "white";
        btn.style.fontSize = "16px";
        
        btn.onclick = () => {
            falarPalavraIndividual(palavra);
            let campo = document.getElementById("campo-resposta");
            campo.value += (campo.value ? " " : "") + palavra;
            
            btn.style.opacity = "0.2";
            btn.style.pointerEvents = "none";

            // Guarda qual botão foi clicado para o "Voltar" saber qual reativar
            historicoBaloes.push(btn.id);
        };
        container.appendChild(btn);
    });
}

function voltarPalavra() {
    if (historicoBaloes.length === 0) return;

    // 1. Pega o ID do último botão clicado e reabilita ele
    let ultimoId = historicoBaloes.pop();
    let btn = document.getElementById(ultimoId);
    if (btn) {
        btn.style.opacity = "1";
        btn.style.pointerEvents = "auto";
    }

    // 2. Remove a última palavra do campo de texto
    let campo = document.getElementById("campo-resposta");
    let palavrasAtuais = campo.value.trim().split(" ");
    palavrasAtuais.pop(); // Remove o último item do array
    
    campo.value = palavrasAtuais.join(" ");
}

function abrirDitadoConfig() {
    let pasta = document.getElementById("select-p").value;
    if (!banco[pasta] || banco[pasta].length === 0) {
        alert("Selecione uma pasta com exercícios primeiro!");
        return;
    }
    abrir('tela-ditado');
    indiceDitado = 0; 
    carregarFraseDitado();
}

function carregarFraseDitado() {
    let pasta = document.getElementById("select-p").value;
    let lista = banco[pasta];
    
    if(!lista || lista.length === 0) {
        document.getElementById("ditado-frase").innerText = "Pasta vazia!";
        return;
    }
    
    // Atualiza o texto na tela
    document.getElementById("ditado-frase").innerText = lista[indiceDitado].coreano;
    document.getElementById("ditado-frase").style.visibility = "visible";
    document.getElementById("in-user-input").value = "";
}

function reproduzirDitado() {
    let txt = document.getElementById("ditado-frase").innerText;
    let msg = new SpeechSynthesisUtterance(txt);
    msg.lang = "ko-KR"; // Coreano
    msg.rate = document.getElementById("speed").value;
    speechSynthesis.speak(msg);
}

function toggleVisibilidade() {
    let el = document.getElementById("ditado-frase");
    
    // Verificamos se está escondido ou visível
    if (el.style.opacity === "0") {
        el.style.opacity = "1"; // Mostra o texto
    } else {
        el.style.opacity = "0"; // Esconde o texto, mas ele continua lá "tocando" o áudio
    }
}

function proximoDitado() {
    let pasta = document.getElementById("select-p").value;
    let lista = banco[pasta];
    if (indiceDitado < lista.length - 1) {
        indiceDitado++;
        carregarFraseDitado();
    } else {
        alert("Fim das frases!");
    }
}

function anteriorDitado() {
    if (indiceDitado > 0) {
        indiceDitado--;
        carregarFraseDitado();
    }
}

function verificarDitado() {
    let original = document.getElementById("ditado-frase").innerText;
    let digitado = document.getElementById("in-user-input").value.trim();
    
    if(original === digitado) {
        alert("Correto! Parabéns.");
    } else {
        alert("Ops! Tente novamente.\nA frase era: " + original);
    }
}
