<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>KLARETTU</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<link rel="apple-touch-icon" href="icone.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">

<style>

 /* DESIGN DO SWITCH NEUMÓRFICO */
.switch {
  position: relative;
  display: inline-block;
  width: 34px;
  height: 18px;
}

.switch input { opacity: 0; width: 0; height: 0; }

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: var(--shd-in);
  transition: .4s;
  border-radius: 20px;
}

.slider:before {
  position: absolute;
  content: "";
  height: 12px;
  width: 12px;
  left: 3px;
  bottom: 3px;
  background-color: #555;
  transition: .4s;
  border-radius: 50%;
}

input:checked + .slider:before {
  transform: translateX(16px);
  background-color: var(--accent);
  box-shadow: 0 0 8px var(--accent);
}   

:root{
--bg-main:#2a2a2a;
--panel-bg:#2a2a2a;
--accent:#00ff9d;
--accent-glow:rgba(0,255,157,0.4);
--shd-out:8px 8px 16px #1b1b1b,-6px -6px 14px #393939;
--shd-in:inset 3px 3px 7px #1b1b1b,inset -3px -3px 7px #393939;
}

body{
background:var(--bg-main);
color:#ccc;
font-family:'Segoe UI',sans-serif;
margin:0;
display:flex;
flex-direction:column;
align-items:center;
height:100vh;
overflow:hidden;
}

/* visor */

.machine-display{
width:88%;
max-width:360px;
height:260px;
background:var(--panel-bg);
margin-top:40px;
border-radius:40px;
box-shadow:var(--shd-out);
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:25px;
}

/* TAMANHO E COR TEXTO EM COREANO */

#coreano-txt{
font-size:28px;
color: #dbd4d3;
text-shadow:0 0 15px var(--accent-glow);
font-weight:bold;
}

/* COR TEXTO TRADUÇÃO */

#traducao-txt{
font-size:13px;
color:#cccccc;
margin-bottom:20px;
}

/* COR TEXTO BALÃO */

select{
background:var(--bg-main);
border:none;
color: #f1f8d0;
padding:12px;
border-radius:17px;
text-shadow: 0 0 15px #a3a3a3; 
width:90%;
outline:none;
}

/* botões */

.bottom-nav{
position:fixed;
bottom:30px;
width:92%;
max-width:420px;
display:flex;
justify-content:space-around;
align-items:center;
}

.btn-hw{
    width: 43px; /* Reduzido de 55px para 45px */
    height: 43px; /* Reduzido de 55px para 45px */
    background: var(--panel-bg);
    border-radius: 20%;
    box-shadow: var(--shd-out);
    border: none;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    cursor: pointer;
}

/* COR ICONES botões */

.btn-hw i{
color:#c5c5c5;
font-size:18px;
}

.btn-play-hw{
width:85px;
height:85px;
background:var(--panel-bg);
border-radius:50%;
box-shadow:var(--shd-out);
border:3px solid #5a5a5a;
display:flex;
justify-content:center;
align-items:center;
cursor:pointer;
}

/* COR BOTÃO INICIAR */

.btn-play-hw i{
color: #e3ffc3;
font-size:32px;
text-shadow: 0 0 15px #2c2e2a; /* O sombreado agora usa a mesma cor */
}

/* CORES TITULOS - modais */

.modal{
display:none;
position:fixed;
inset:0;
background:var(--bg-main);
padding:25px;
overflow-y:auto;
}

input,textarea{
width:100%;
padding:12px;
background:#1a1a1a;
border:none;
border-radius:10px;
color:white;
margin-bottom:10px;
box-shadow:var(--shd-in);
}

.btn-save{
background:var(--accent);
color:#000000;
padding:12px;
border:none;
border-radius:8px;
font-weight:bold;
width:100%;
cursor:pointer;
}

.btn-back{
margin-top:20px;
width:100%;
background:none;
border:1px solid #1a1919;
color:#c4c0c0;
padding:10px;
cursor:pointer;
}

.balao-arrastavel {
    touch-action: none;
    user-select: none;
    z-index: 100;
    transition: transform 0.1s;
}

#area-destino {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    padding: 10px;
    width: 100%;
}

.alvo-destino {
    padding: 10px;
    border: 2px dashed #555;
    border-radius: 10px;
    min-width: 80px;
    text-align: center;
    font-size: 13px;
    color: #888;
    background: rgba(255,255,255,0.05);
}

/* ANIMAÇÃO DAS BARRAS DE VOZ */
@keyframes wave-anim {
    0%, 100% { height: 10px; opacity: 0.3; }
    50% { height: 35px; opacity: 1; }
}

.animar-onda .bar {
    animation: wave-anim 0.6s infinite ease-in-out;
}

/* Diferentes atrasos para cada barra para criar um efeito fluido */
.animar-onda .bar:nth-child(1) { animation-delay: 0.0s; }
.animar-onda .bar:nth-child(2) { animation-delay: 0.1s; }
.animar-onda .bar:nth-child(3) { animation-delay: 0.2s; }
.animar-onda .bar:nth-child(4) { animation-delay: 0.3s; }
.animar-onda .bar:nth-child(5) { animation-delay: 0.4s; }
.animar-onda .bar:nth-child(6) { animation-delay: 0.5s; }

/* ESTADO ATIVO DO MICROFONE */
#mic-button.gravando {
    box-shadow: var(--shd-in); /* Efeito de botão pressionado */
    transform: scale(0.95);
}

#mic-button.gravando i {
    color: #ff4444 !important; /* Microfone fica vermelho */
    text-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
}

/* ESTILO DA ÁREA DE TEXTO DA TELA ANTERIOR (Ajuste fino) */
#input-escrita-final {
    width: 100%;
    background: var(--shd-in);
    border: none;
    border-radius: 15px;
    padding: 15px;
    color: var(--accent);
    font-family: inherit;
    font-weight: bold;
    text-align: center;
    margin-top: 10px;
    box-sizing: border-box;
}

</style>
</head>

<script>

function falarTreino(velocidade) {
    // Pega o texto da pergunta ou o item atual da lista de treino
    let texto = listaTreino[indiceTreino].coreano; 
    
    if(!texto) return;

    speechSynthesis.cancel(); 

    let msg = new SpeechSynthesisUtterance(texto);
    msg.lang = document.getElementById("idioma-voz").value;
    msg.rate = velocidade; 
    
    speechSynthesis.speak(msg);
}    

/* BANCO */

let banco={}
let gramatica=[]

/* INIT */

window.onload=()=>{

let db=localStorage.getItem("db")
let gr=localStorage.getItem("gram")

if(db) banco=JSON.parse(db)
if(gr) gramatica=JSON.parse(gr)

atualizarPastas()

}


/* UI */

function abrir(id){

document.getElementById(id).style.display="block"

}

function fechar(){

document.querySelectorAll(".modal").forEach(m=>m.style.display="none")

}

/* SALVAR EXERCICIO */

function salvarExercicio(){

let pasta=document.getElementById("in-p").value.trim()
let coreano=document.getElementById("in-c").value.trim()
let traducao=document.getElementById("in-t").value.trim()
let romanizacao=document.getElementById("in-r").value.trim()
let ordem=parseInt(document.getElementById("in-o").value)

if(!pasta||!coreano||!traducao){
alert("Preencha tudo")
return
}

if(!banco[pasta]) banco[pasta]=[]

banco[pasta].push({
ordem:ordem||banco[pasta].length+1,
coreano,
traducao,
romanizacao
})

localStorage.setItem("db",JSON.stringify(banco))

atualizarPastas()

alert("Salvo")

}

/* PASTAS */

function atualizarPastas(){

/* atualizar seletor da pagina principal */

let seletorPrincipal = document.getElementById("select-p")

if(seletorPrincipal){

seletorPrincipal.innerHTML=""

for(let pasta in banco){

let opt=document.createElement("option")
opt.value=pasta
opt.textContent=pasta

seletorPrincipal.appendChild(opt)

}

}


/* atualizar seletor do dialogo */

let seletorDialogo = document.getElementById("select-dialogo")

if(seletorDialogo){

seletorDialogo.innerHTML=""

for(let pasta in banco){

let opt=document.createElement("option")
opt.value=pasta
opt.textContent=pasta

seletorDialogo.appendChild(opt)

}

}


/* atualizar lista visual da tela arquivo */

mostrarPastasArquivo()

}

function mostrarPastasArquivo(){

let area = document.getElementById("lista-pastas")

if(!area) return

area.innerHTML=""

for(let pasta in banco){

let linha = document.createElement("div")

linha.style.marginBottom="10px"

linha.innerHTML = `
<label>
<input type="checkbox" onchange="marcarEstudado('${pasta}',this.checked)">
${pasta}
</label>

<button onclick="editarPasta('${pasta}')">Editar itens</button>

<button onclick="apagarPasta('${pasta}')">Apagar pasta</button>
`

area.appendChild(linha)

}

}

/* VOZ */

function falar(txt){

/* CONTROLE DE DIÁLOGO (PLAY/PAUSE/INICIAR) */
let dialogoRodando = false;
let indiceDialogo = 0; 

// Agora a função aceita o comando 'resetar'
function iniciarDialogo(resetar = true) {
    let pasta = document.getElementById("select-dialogo").value;

    if (!banco[pasta]) {
        alert("Sem exercícios");
        return;
    }

    // Se resetar for true (botão INICIAR), volta para o 0.
    // Se for false (botão PLAY da home), mantém o índice atual.
    if (resetar) {
        indiceDialogo = 0;
    }

    dialogoRodando = true;
    let lista = banco[pasta];
    let velocidade = document.getElementById("velocidade").value;
    let tempo = parseInt(document.getElementById("tempo").value);

    function loop() {
        if (!dialogoRodando) return;

        // Se chegar ao fim da pasta, reinicia o ciclo
        if (indiceDialogo >= lista.length) {
            indiceDialogo = 0;
        }

        let item = lista[indiceDialogo];

        /* Atualizar Display */
        document.getElementById("coreano-txt").innerText = item.coreano;
        document.getElementById("traducao-txt").innerText = item.traducao;

        /* Criar Voz */
        let msg = new SpeechSynthesisUtterance(item.coreano);
        msg.lang = document.getElementById("idioma-voz").value;
        msg.rate = velocidade;

        /* Quando a fala terminar */
        msg.onend = function() {
            if (dialogoRodando) {
                indiceDialogo++;
                setTimeout(loop, tempo);
            }
        };

        speechSynthesis.speak(msg);
    }

    loop();
}

function pausarDialogo() {
    dialogoRodando = false;
    speechSynthesis.cancel();
}

// Variável para guardar a ordem dos botões clicados (coloque no topo do script)
let historicoBaloes = [];

function gerarBaloesPalavras(frase) {
    let container = document.getElementById("container-palavras");
    container.innerHTML = "";
    historicoBaloes = []; // Reseta o histórico ao iniciar nova questão

    let palavras = frase.split(" ").sort(() => Math.random() - 0.5);

    palavras.forEach((palavra, index) => {
        let btn = document.createElement("button");
        btn.innerText = palavra;
        btn.id = "btn-palavra-" + index; // ID único para podermos reabilitar depois
        
        // Estilo mantido

        btn.style.borderRadius = "15px";
        btn.style.background = "var(--panel-bg)";
        btn.style.boxShadow = "var(--shd-out)";
        btn.style.color = "white";
        btn.style.fontSize = "16px";
        
        btn.onclick = () => {
            falarPalavraIndividual(palavra);
            let campo = document.getElementById("campo-resposta");
            campo.value += (campo.value ? " " : "") + palavra;
            
            btn.style.opacity = "0.2";
            btn.style.pointerEvents = "none";

            // Guarda qual botão foi clicado para o "Voltar" saber qual reativar
            historicoBaloes.push(btn.id);
        };
        container.appendChild(btn);
    });
}

function voltarPalavra() {
    if (historicoBaloes.length === 0) return;

    // 1. Pega o ID do último botão clicado e reabilita ele
    let ultimoId = historicoBaloes.pop();
    let btn = document.getElementById(ultimoId);
    if (btn) {
        btn.style.opacity = "1";
        btn.style.pointerEvents = "auto";
    }

    // 2. Remove a última palavra do campo de texto
    let campo = document.getElementById("campo-resposta");
    let palavrasAtuais = campo.value.trim().split(" ");
    palavrasAtuais.pop(); // Remove o último item do array
    
    campo.value = palavrasAtuais.join(" ");
}

// --- LÓGICA DE MOVIMENTO E VERIFICAÇÃO ---

function tornarArrastavelMobile(el, txt, totalPalavras) {
    let startX, startY, origX, origY;

    el.addEventListener('touchstart', (e) => {
        let t = e.touches[0];
        startX = t.clientX; startY = t.clientY;
        origX = el.offsetLeft; origY = el.offsetTop;
        el.style.zIndex = "1000";
    });

    el.addEventListener('touchmove', (e) => {
        e.preventDefault();
        let t = e.touches[0];
        el.style.left = (origX + (t.clientX - startX)) + "px";
        el.style.top = (origY + (t.clientY - startY)) + "px";
    }, {passive: false});

    el.addEventListener('touchend', (e) => {
        let t = e.changedTouches[0];
        const alvos = document.querySelectorAll('.alvo-destino');
        let acertou = false;

        alvos.forEach(alvo => {
            const rect = alvo.getBoundingClientRect();
            if (t.clientX >= rect.left && t.clientX <= rect.right &&
                t.clientY >= rect.top && t.clientY <= rect.bottom) {
                
                if (alvo.dataset.esperado === txt && !alvo.classList.contains('preenchido')) {
                    alvo.style.background = "var(--accent)";
                    alvo.style.color = "#000";
                    alvo.classList.add('preenchido');
                    el.style.display = "none";
                    palavrasCorretas++;
                    acertou = true;
                    verificarFimExercicio(totalPalavras.length);
                }
            }
        });

        if (!acertou) {
            el.style.left = origX + "px";
            el.style.top = origY + "px";
            el.style.zIndex = "100";
        }
    });
}

function verificarFimExercicio(total) {

        let pasta = document.getElementById("select-p").value;
        let item = banco[pasta][indiceCorrelacao];
        document.getElementById("feedback-final").style.display = "block";
        document.getElementById("frase-completa-display").innerText = item.coreano;
        reproduzirAudioCorrelacao();
    }
}

let indiceVoz = 0;
let reconhecedorVoz;

// Inicializa o motor de reconhecimento (Web Speech API)
if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    reconhecedorVoz = new SpeechRecognition();
    reconhecedorVoz.lang = 'ko-KR'; // Define o idioma para Coreano
    reconhecedorVoz.continuous = false; // Para de ouvir assim que o usuário termina a frase
    reconhecedorVoz.interimResults = false; // Só entrega o resultado final

    // Quando o microfone começa a ouvir
    reconhecedorVoz.onstart = () => {
        document.getElementById("mic-button").classList.add("gravando");
        document.getElementById("wave-container").classList.add("animar-onda");
        document.getElementById("status-mic").innerText = "OUVINDO...";
        document.getElementById("label-resultado").innerText = "";
    };

    // Quando recebe o resultado da fala
    reconhecedorVoz.onresult = (event) => {
        const falaUsuario = event.results[0][0].transcript;
        compararPronuncia(falaUsuario);
    };

    // Quando ocorre algum erro ou termina
    reconhecedorVoz.onend = () => {
        document.getElementById("mic-button").classList.remove("gravando");
        document.getElementById("wave-container").classList.remove("animar-onda");
        if(document.getElementById("label-resultado").innerText === "") {
            document.getElementById("status-mic").innerText = "TOQUE PARA TENTAR DE NOVO";
        }
    };
}

function compararPronuncia(fala) {
    let original = document.getElementById("texto-exemplo-voz").innerText;
    
    // Limpeza de textos para comparação justa (remove espaços e pontuação)
    let textoLimpo = original.replace(/[?.!, ]/g, "");
    let falaLimpa = fala.replace(/[?.!, ]/g, "");

    let label = document.getElementById("label-resultado");
    
    // Verifica se a fala contém a frase original (tolerante a sotaques e palavras extras)
    if (falaLimpa.includes(textoLimpo) || textoLimpo.includes(falaLimpa)) {
        label.innerText = "EXCELENTE! ✨";
        label.style.color = "var(--accent)";
        document.getElementById("status-mic").innerText = "VOCÊ DISSE: " + fala;
    } else {
        label.innerText = "QUASE LÁ! 👍";
        label.style.color = "#ffcc00";
        document.getElementById("status-mic").innerText = "OUVI: " + fala;
    }
}

        mostrarExercicioVoz();
    } else {
        alert("Parabéns! Você praticou todas as frases desta pasta. 🎉");
        fechar();
    }
}

function toggleTraducaoGlobal() {
    const isChecked = document.getElementById("check-ocultar-geral").checked;
    
    // Lista de IDs que serão afetados pelo modo invisível
    const elementosParaEsconder = [
        "traducao-txt",          // Tradução na tela principal
        "traducao-exemplo-voz",  // Tradução na tela de voz
        "traducao-exercicio"     // Caso você tenha algum outro campo de tradução
    ];
    
    elementosParaEsconder.forEach(id => {
        const el = document.getElementById(id);
        if (el) {
            // Usamos opacity para não quebrar o layout, mas sumir com a "cola"
            el.style.opacity = isChecked ? "0" : "1";
            el.style.transition = "opacity 0.3s ease";
        }
    });
}
